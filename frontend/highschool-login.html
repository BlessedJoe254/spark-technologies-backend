<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>High School Program - Log in</title>
  <style>
    :root { --g:#1f8a5b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(160deg,#0f1c16,#173026 60%,#1f8a5b); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:#14201a; }
    .card { width:100%; max-width:420px; background:#fff; border-radius:20px; padding:30px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .tag { display:inline-block; font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--g); background:#e6efe9; padding:5px 11px; border-radius:20px; }
    h1 { margin:12px 0 4px; font-size:24px; }
    p.sub { margin:0 0 18px; color:#5b6b62; font-size:14px; }
    label { display:block; font-size:13px; font-weight:600; margin:12px 0 5px; }
    input { width:100%; padding:12px 13px; border:1px solid #c9d6cf; border-radius:11px; font:inherit; }
    input:focus { outline:2px solid var(--g); border-color:var(--g); }
    button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:11px; background:var(--g); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; }
    #msg { margin-top:12px; font-size:14px; min-height:18px; }
    .foot { margin-top:16px; font-size:13px; text-align:center; color:#5b6b62; }
    .foot a { color:var(--g); }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">HOLIDAY PROGRAM</span>
    <h1>Student log in</h1>
    <p class="sub">Use the phone number you registered with.</p>
    <form id="f" novalidate>
      <label>Phone number</label><input id="phone" type="tel" placeholder="07xx xxx xxx" required>
      <label>Password</label><input id="password" type="password" placeholder="Your password" required>
      <button type="submit" id="go">Log in</button>
      <div id="msg"></div>
    </form>
    <div class="foot">New here? <a href="highschool-register.html">Register</a></div>
  </div>
  <script>
  (function () {
    var f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
    function say(t, bad) { msg.style.color = bad ? "#b3261e" : "#1b5e3f"; msg.textContent = t; }
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      var phone = document.getElementById("phone").value.trim(), pw = document.getElementById("password").value;
      if (!phone || !pw) { say("Enter your phone number and password.", true); return; }
      go.disabled = true; say("Logging in...", false);
      fetch("/api/login-highschool", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "include", body: JSON.stringify({ phone: phone, password: pw }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { say(res.d.error || "Could not log in.", true); go.disabled = false; return; }
          location.href = "highschool.html";
        })
        .catch(function () { say("Could not reach the server.", true); go.disabled = false; });
    });
  })();
  </script>
</body>
</html>
